common:
  device_id: raspberrypi

middleware:
  adapter: zenoh
  connect: tcp/127.0.0.1:7447
  key_prefix: face_tracking

camera:
  device_path: /dev/v4l/by-id/usb-Generic_Integrated_Webcam_200901010001-video-index0
  width: 1280
  height: 720
  capture_fps: 30
  publish_hz: 10
  jpeg_quality: 80
  reconnect_seconds: 2.0

detector:
  model_path: models/yolov8n-face-lindevs.onnx
  inference_hz: 5
  image_size: 640
  confidence: 0.50
  iou: 0.45
  tracker:
    retention_ms: 2500
    min_match_iou: 0.10
    max_center_distance_ratio: 1.0

controller:
  control_rate_hz: 20
  deadband_x_px: 30
  deadband_y_px: 24
  kp_pan_deg_per_px: 0.015
  kp_tilt_deg_per_px: 0.015
  max_pan_step_deg: 3.5
  max_tilt_step_deg: 2.2
  reverse_pan_output: true
  reverse_tilt_output: true
  observation_timeout_ms: 600
  error_smoothing: 0.6

servo:
  pwm_chip: 0
  frequency_hz: 50
  command_max_age_ms: 1500
  upstream_timeout_ms: 5000
  max_input_pan_delta_deg: 4.0
  max_input_tilt_delta_deg: 2.5
  pan_max_velocity_deg_per_s: 18.0
  tilt_max_velocity_deg_per_s: 12.0
  tracking_enabled: true
  pan:
    gpio: 18
    rated_max_deg: 270
    min_deg: 100
    max_deg: 170
    home_deg: 135
    min_pulse_us: 500
    max_pulse_us: 2500
    invert: false
  tilt:
    gpio: 19
    rated_max_deg: 180
    min_deg: 15
    max_deg: 45
    home_deg: 20
    min_pulse_us: 500
    max_pulse_us: 2500
    invert: false

hmi:
  host: 0.0.0.0
  port: 8080
  stale_after_ms: 500
  offline_after_ms: 3000
  target:
    missing_frame_threshold: 10
    reacquire_timeout_ms: 1000
    selection_max_age_ms: 1000
