common:
  device_id: raspberrypi

middleware:
  adapter: zenoh
  connect: tcp/127.0.0.1:7447
  key_prefix: face_tracking

camera:
  device_path: /dev/v4l/by-id/usb-Generic_Integrated_Webcam_200901010001-video-index0
  width: 1280
  height: 720
  capture_fps: 30
  publish_hz: 10
  jpeg_quality: 80
  reconnect_seconds: 2.0

detector:
  model_path: models/yolov8n-face-lindevs.onnx
  inference_hz: 5
  image_size: 640
  confidence: 0.50
  iou: 0.45
  tracker:
    retention_ms: 1000
    min_match_iou: 0.10
    max_center_distance_ratio: 1.0

controller:
  control_rate_hz: 20
  deadband_x_px: 30
  deadband_y_px: 24
  kp_pan_deg_per_px: 0.01
  kp_tilt_deg_per_px: 0.01
  max_pan_step_deg: 1.5
  max_tilt_step_deg: 1.0
  observation_timeout_ms: 600

hmi:
  host: 0.0.0.0
  port: 8080
  stale_after_ms: 500
  offline_after_ms: 3000
  target:
    lost_after_ms: 400
    reacquire_timeout_ms: 1000
    selection_max_age_ms: 1000
