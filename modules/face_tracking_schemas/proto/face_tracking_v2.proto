syntax = "proto3";

package face_tracking.wire.v2;

message FrameMetadata {
  uint32 schema_version = 1;
  string source_instance_id = 2;
  uint64 sequence = 3;
  int64 captured_at_unix_ns = 4;
  uint32 width = 5;
  uint32 height = 6;
  string capture_format = 7;
  uint32 jpeg_quality = 8;
}

message DetectionBox {
  float x = 1;
  float y = 2;
  float width = 3;
  float height = 4;
  float confidence = 5;
  uint64 track_id = 6;
}

message DetectionResult {
  uint32 schema_version = 1;
  string source_instance_id = 2;
  uint64 sequence = 3;
  int64 captured_at_unix_ns = 4;
  uint32 image_width = 5;
  uint32 image_height = 6;
  double inference_ms = 7;
  repeated DetectionBox boxes = 8;
  string tracker_instance_id = 9;
}

enum CameraState {
  CAMERA_STATE_UNSPECIFIED = 0;
  CAMERA_STATE_STARTING = 1;
  CAMERA_STATE_STREAMING = 2;
  CAMERA_STATE_RECONNECTING = 3;
  CAMERA_STATE_ERROR = 4;
  CAMERA_STATE_STOPPED = 5;
}

message CameraStatus {
  uint32 schema_version = 1;
  CameraState state = 2;
  double capture_fps = 3;
  double publish_fps = 4;
  uint64 captured_frames = 5;
  uint64 published_frames = 6;
  uint64 dropped_frames = 7;
  string device_path = 8;
  optional string last_error = 9;
}

enum DetectorState {
  DETECTOR_STATE_UNSPECIFIED = 0;
  DETECTOR_STATE_STARTING = 1;
  DETECTOR_STATE_STREAMING = 2;
  DETECTOR_STATE_ERROR = 3;
  DETECTOR_STATE_STOPPED = 4;
}

message DetectorStatus {
  uint32 schema_version = 1;
  DetectorState state = 2;
  double inference_fps = 3;
  uint64 processed_frames = 4;
  uint64 dropped_frames = 5;
  uint64 decode_errors = 6;
  uint64 inference_errors = 7;
  optional string last_error = 8;
}

enum TrackingState {
  TRACKING_STATE_UNSPECIFIED = 0;
  TRACKING_STATE_NO_TARGET = 1;
  TRACKING_STATE_TRACKING = 2;
  TRACKING_STATE_LOST = 3;
  TRACKING_STATE_MISSING = 4;
}

message SelectedTargetObservation {
  uint32 schema_version = 1;
  string source_instance_id = 2;
  string tracker_instance_id = 3;
  uint64 sequence = 4;
  int64 captured_at_unix_ns = 5;
  uint64 selected_track_id = 6;
  float target_center_x = 7;
  float target_center_y = 8;
  uint32 image_width = 9;
  uint32 image_height = 10;
  TrackingState tracking_state = 11;
}

enum ControllerDecision {
  CONTROLLER_DECISION_UNSPECIFIED = 0;
  CONTROLLER_DECISION_APPLIED = 1;
  CONTROLLER_DECISION_DEADBAND = 2;
  CONTROLLER_DECISION_NO_TARGET = 3;
  CONTROLLER_DECISION_LOST = 4;
  CONTROLLER_DECISION_STALE = 5;
  CONTROLLER_DECISION_DUPLICATE = 6;
  CONTROLLER_DECISION_OUT_OF_ORDER = 7;
  CONTROLLER_DECISION_MISSING_HOLD = 8;
}

message PanTiltDelta {
  uint32 schema_version = 1;
  string source_instance_id = 2;
  string tracker_instance_id = 3;
  uint64 sequence = 4;
  int64 captured_at_unix_ns = 5;
  int64 computed_at_unix_ns = 6;
  uint64 selected_track_id = 7;
  float delta_pan_deg = 8;
  float delta_tilt_deg = 9;
  ControllerDecision reason = 10;
}

enum PixelCenterControllerState {
  PIXEL_CENTER_CONTROLLER_STATE_UNSPECIFIED = 0;
  PIXEL_CENTER_CONTROLLER_STATE_STARTING = 1;
  PIXEL_CENTER_CONTROLLER_STATE_ACTIVE = 2;
  PIXEL_CENTER_CONTROLLER_STATE_HOLDING = 3;
  PIXEL_CENTER_CONTROLLER_STATE_ERROR = 4;
  PIXEL_CENTER_CONTROLLER_STATE_STOPPED = 5;
}

message PixelCenterControllerStatus {
  uint32 schema_version = 1;
  PixelCenterControllerState state = 2;
  double observation_age_ms = 3;
  float error_x_px = 4;
  float error_y_px = 5;
  float last_delta_pan_deg = 6;
  float last_delta_tilt_deg = 7;
  uint64 processed_observations = 8;
  uint64 stale_observations = 9;
  uint64 duplicate_observations = 10;
  uint64 out_of_order_observations = 11;
  optional string last_rejection_reason = 12;
}

enum ServoDriverState {
  SERVO_DRIVER_STATE_UNSPECIFIED = 0;
  SERVO_DRIVER_STATE_STARTING = 1;
  SERVO_DRIVER_STATE_HOMING = 2;
  SERVO_DRIVER_STATE_HOLDING = 3;
  SERVO_DRIVER_STATE_TRACKING = 4;
  SERVO_DRIVER_STATE_ERROR = 5;
  SERVO_DRIVER_STATE_STOPPED = 6;
}

enum ServoDecision {
  SERVO_DECISION_UNSPECIFIED = 0;
  SERVO_DECISION_HOME_STARTUP = 1;
  SERVO_DECISION_APPLIED = 2;
  SERVO_DECISION_HELD_DEADBAND = 3;
  SERVO_DECISION_HELD_MISSING = 4;
  SERVO_DECISION_HELD_LIMIT = 5;
  SERVO_DECISION_HOME_LOST = 6;
  SERVO_DECISION_HOME_NO_TARGET = 7;
  SERVO_DECISION_HOME_STALE = 8;
  SERVO_DECISION_HOME_UPSTREAM_TIMEOUT = 9;
  SERVO_DECISION_REJECTED_DUPLICATE = 10;
  SERVO_DECISION_REJECTED_OUT_OF_ORDER = 11;
  SERVO_DECISION_REJECTED_INVALID = 12;
  SERVO_DECISION_ERROR = 13;
}

message PanTiltCommandedState {
  uint32 schema_version = 1;
  int64 updated_at_unix_ns = 2;
  float commanded_pan_deg = 3;
  float commanded_tilt_deg = 4;
  uint64 last_track_id = 5;
  ServoDriverState state = 6;
  ServoDecision decision = 7;
  bool pan_limit_held = 8;
  bool tilt_limit_held = 9;
  bool pwm_active = 10;
  optional string last_error = 11;
  uint64 applied_commands = 12;
  uint64 rejected_commands = 13;
}
